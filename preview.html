<div class="wrap">
  <div class="slot" style="width:600px;height:248px"><pika-pet-card id="a"></pika-pet-card></div>
  <div class="slot" style="width:380px;height:184px"><pika-pet-card id="b"></pika-pet-card></div>

<div id="log"></div>
<script src="pika-pet-card.js"></script>
<script>
  const log = (t) => (document.getElementById('log').textContent = t);
  const states = {
    'sun.sun': { state: 'above_horizon', attributes: {
      elevation: 28, azimuth: 180,
      // Uhrzeiten für sleep_start/sleep_end: heute 07:56 und 18:33 Ortszeit (Datum egal, zählt nur die Uhrzeit)
      next_rising: new Date(new Date().setHours(7, 56, 0, 0)).toISOString(),
      next_setting: new Date(new Date().setHours(18, 33, 0, 0)).toISOString(),
    } },
    'weather.forecast_home': {
      state: 'partlycloudy',
      attributes: { temperature: 14, temperature_unit: '°C', cloud_coverage: 40, wind_speed: 12, wind_speed_unit: 'km/h', wind_bearing: 240 },
    },
    // leer wie ein frisch angelegter Helfer (bei "unknown" wartet die Karte 20 s, ob es nur der Start von HA ist)
    'input_text.pika_status': { state: '', attributes: {} },
  };
  const cards = [document.getElementById('a'), document.getElementById('b')];
  const hass = {
    states,
    config: { latitude: 50.06, longitude: 8.69 },
    callService(domain, service, data) {
      states[data.entity_id] = { state: data.value, attributes: {} };
      log(`${domain}.${service} → ${data.value}`);
      setTimeout(push, 50);
      return Promise.resolve();
    },
  };
  function push() {
    hass.states = { ...states };
    cards.forEach((c) => (c.hass = hass));
  }
  cards.forEach((c) => c.setConfig({ name: 'Pika', entity: 'input_text.pika_status' }));
  push();

  document.querySelectorAll('[data-sun]').forEach((b) =>
    b.addEventListener('click', () => {
      const v = b.dataset.sun;
      for (const c of cards) {
        if (v === 'real') {
          c._dbgSleep = c._dbgElev = c._dbgAz = c._dbgDate = null;
        } else {
          const [az, el, sleep] = v.split(',').map(Number);
          c._dbgAz = az;
          c._dbgElev = el;
          c._dbgSleep = !!sleep;
          // Mond passend zur gewählten Tageszeit: heute, Stunde aus dem Azimut geschätzt
          const d = new Date();
          d.setHours(Math.round((az / 15 + 24) % 24), 0, 0, 0);
          c._dbgDate = d.getTime();
        }
        c._tick();
      }
    })
  );
  document.querySelectorAll('[data-wx]').forEach((b) =>
    b.addEventListener('click', () => {
      const w = states['weather.forecast_home'];
      const wind = b.dataset.wx === 'windy' ? 45 : b.dataset.wx === 'pouring' || b.dataset.wx.startsWith('lightning') ? 30 : 12;
      states['weather.forecast_home'] = { state: b.dataset.wx, attributes: { ...w.attributes, wind_speed: wind, cloud_coverage: { sunny: 5, partlycloudy: 40 }[b.dataset.wx] ?? 90 } };
      push();
    })
  );
  document.getElementById('cold').addEventListener('click', () => {
    const w = states['weather.forecast_home'];
    states['weather.forecast_home'] = { ...w, attributes: { ...w.attributes, temperature: w.attributes.temperature < 3 ? 14 : -2 } };
    push();
  });
  document.getElementById('burrow').addEventListener('click', () => cards.forEach((c) => { c._next = 'burrow'; c._interrupt(); }));
  document.getElementById('lookout').addEventListener('click', () => cards.forEach((c) => { c._next = 'lookout'; c._interrupt(); }));
  document.getElementById('gather').addEventListener('click', () => cards.forEach((c) => { if (c._flowers.length) { c._next = 'gather'; c._interrupt(); } }));
  // Häufchen: die Karte rechnet sie aus der Uhrzeit, also die Uhr der Häufchen vorstellen
  const shift = (ms) => cards.forEach((c) => {
    c._dbgShift = ms == null ? 0 : c._dbgShift + ms;
    c._poopCache = null;
    c._renderStats();
  });
  document.getElementById('poo1').addEventListener('click', () => {
    const c = cards[0];
    const n = c._stats && c._poopTimes(c._stats.c, c._now() + 864e5).find((t) => t > c._now());
    if (n) shift(n - cards[0]._now() + 1000);
  });
  document.getElementById('poo4').addEventListener('click', () => shift(4 * 36e5));
  document.getElementById('poo24').addEventListener('click', () => shift(24 * 36e5));
  document.getElementById('clock').addEventListener('click', () => shift(null));
  document.getElementById('sniff').addEventListener('click', () => cards.forEach((c) => { if (c._pileEls.size) { c._next = 'sniff'; c._interrupt(); } }));
  document.getElementById('clean').addEventListener('click', () => {
    const c = cards[0];
    [...c._pileEls.keys()].forEach((k, i) => setTimeout(() => c._cleanPile(k), i * 250));
  });
  // Besuch sofort, auch wenn Wetter oder Tageszeit es sonst nicht erlauben würden
  document.getElementById('bird').addEventListener('click', () => cards.forEach((c) => c._visit('bird', c._critId, true)));
  document.getElementById('mouse').addEventListener('click', () => cards.forEach((c) => c._visit('mouse', c._critId, true)));
  // Besuche werden aus der Uhr berechnet: Besuchsuhr aller Karten (_dbgShiftMs) 5 s vor den nächsten Start stellen
  const visitAt = (c, kind) => {
    if (kind !== 'friend') return c._critNext(kind, c._visitNow() + 1000).at;
    // Pino: läuft gerade einer, den danach
    const save = c._dbgShiftMs;
    let s = c._friendSchedule();
    if (!s.nextInMs) {
      c._dbgShiftMs += s.stayMs + 1000;
      s = c._friendSchedule();
    }
    const at = c._visitNow() + s.nextInMs;
    c._dbgShiftMs = save;
    return at;
  };
  document.querySelectorAll('[data-next]').forEach((b) =>
    b.addEventListener('click', () => {
      const k = b.dataset.next;
      const c0 = cards[0];
      let shift = 0;
      if (k !== 'real') {
        const kinds = k === 'any' ? ['bird', 'mouse', 'friend'] : [k];
        const [at, kind] = kinds.map((x) => [visitAt(c0, x), x]).sort((a, z) => a[0] - z[0])[0];
        shift = c0._dbgShiftMs + (at - 5000 - c0._visitNow());
        log(`Besuchsuhr → ${new Date(at - 5000).toLocaleTimeString('de-DE')}, ${kind} um ${new Date(at).toLocaleTimeString('de-DE')}`);
      } else log('Besuchsuhr: echte Zeit');
      for (const c of cards) {
        c._dbgShiftMs = shift;
        c._critLast = {}; // die Uhr springt (auch zurück): gemerkte Besuche gelten nicht mehr
        c._restartCritters();
        // Pino bleibt, wenn nur Vogel oder Maus vorgezogen werden (beides zusammen ansehen)
        if (k === 'bird' || k === 'mouse') continue;
        c._frUsed = 0;
        c._friendStop();
        c._friendPlan();
      }
    })
  );
  document.getElementById('watch').addEventListener('click', () => cards.forEach((c) => {
    const n = c._bird?.sitting ? 'watchBird' : c._mouse?.out ? 'watchMouse' : null;
    if (n) { c._next = n; c._interrupt(); }
  }));
  // Flieger: wie die Flightradar24-Integration alle 20 s neue Positionen, raus aus 15 km = weg
  const HOME = hass.config;
  const KX = 111.32 * Math.cos((HOME.latitude * Math.PI) / 180);
  const DTM = { airport_destination_latitude: 50.0379, airport_destination_longitude: 8.5622 };
  const at = (e, n) => ({ latitude: HOME.latitude + n / 110.57, longitude: HOME.longitude + e / KX });
  const dist = (f) => Math.hypot((f.longitude - HOME.longitude) * KX, (f.latitude - HOME.latitude) * 110.57);
  const mk = (o) => ({ id: Math.random().toString(16).slice(2, 10), on_ground: 0, aircraft_category: 'Airplane', vertical_speed: 0, ...o });
  const FLIGHTS = {
    anflug: () => mk({ ...at(9, 1.6), heading: 243, altitude: 2600, ground_speed: 150, vertical_speed: -700, flight_number: 'W62736',
      airline_short: 'Wizz Air', airline_icao: 'WZZ', aircraft_model: 'Airbus A321-271NX', airport_origin_city: 'Katowice', airport_destination_city: 'Frankfurt', ...DTM }),
    abflug: () => mk({ ...at(-4, -0.9), heading: 63, altitude: 1500, ground_speed: 170, vertical_speed: 1800, flight_number: 'EW9542',
      airline_short: 'Eurowings', airline_icao: 'EWG', aircraft_model: 'Airbus A320-214', airport_origin_city: 'Frankfurt', airport_destination_city: 'Palma de Mallorca' }),
    reise: () => mk({ ...at(-12, 4), heading: 105, altitude: 37000, ground_speed: 470, flight_number: 'TK1724',
      airline_short: 'Turkish Airlines', airline_icao: 'THY', aircraft_model: 'Boeing 737-8F2', airport_origin_city: 'Amsterdam', airport_destination_city: 'Istanbul' }),
    heli: () => mk({ ...at(4, -1), heading: 275, altitude: 900, ground_speed: 110, flight_number: '', callsign: 'CHX8',
      aircraft_category: 'Helicopter', aircraft_model: 'Airbus Helicopters H135', airline_short: 'ADAC Luftrettung' }),
    // zwei auf derselben Linie in gleicher Höhe, die sich in etwa 30 s mitten im Bild begegnen
    begegnung: () => [
      mk({ ...at(2.7, 0), heading: 270, altitude: 2500, ground_speed: 170, flight_number: 'EW1234',
        airline_short: 'Eurowings', airline_icao: 'EWG', aircraft_model: 'Airbus A320-214', airport_origin_city: 'Munich', airport_destination_city: 'London' }),
      mk({ ...at(-2.7, 0), heading: 90, altitude: 2500, ground_speed: 170, flight_number: 'LH2020',
        airline_short: 'Lufthansa', airline_icao: 'DLH', aircraft_model: 'Airbus A321-131', airport_origin_city: 'London', airport_destination_city: 'Munich' }),
    ],
    cessna: () => mk({ ...at(-6, 3), heading: 80, altitude: 2200, ground_speed: 95, flight_number: '', callsign: 'DEABC',
      aircraft_model: 'Cessna 172S Skyhawk', airport_origin_city: 'Marl', airport_destination_city: 'Paderborn' }),
  };
  let flights = [];
  function pushFlights() {
    states['sensor.flightradar24_current_in_area'] = { state: String(flights.length), attributes: { flights }, last_updated: new Date().toISOString() };
    push();
  }
  setInterval(() => {
    if (!flights.length) return;
    flights = flights.map((f) => {
      const v = ((f.ground_speed * 1.852) / 3600) * 20;
      const h = (f.heading * Math.PI) / 180;
      return { ...f, latitude: f.latitude + (v * Math.cos(h)) / 110.57, longitude: f.longitude + (v * Math.sin(h)) / KX,
        altitude: Math.max(0, f.altitude + f.vertical_speed / 3) };
    }).filter((f) => dist(f) <= 15);
    pushFlights();
  }, 20000);
  document.querySelectorAll('[data-fl]').forEach((b) =>
    b.addEventListener('click', () => {
      flights = b.dataset.fl === 'none' ? [] : flights.concat(FLIGHTS[b.dataset.fl]());
      pushFlights();
    })
  );
  // Beschäftigung sofort, auch ohne passendes Wetter (Drachen fliegt dann mit der Windrichtung aus dem Wetter)
  document.querySelectorAll('[data-hob]').forEach((b) =>
    b.addEventListener('click', () => cards.forEach((c) => {
      const h = b.dataset.hob;
      c._dbgDoze = h === 'doze';
      c._next = h === 'doze' ? 'read' : h;
      c._interrupt();
    }))
  );
  document.getElementById('hungry').addEventListener('click', () => {
    const now = Math.round(Date.now() / 1000);
    hass.callService('input_text', 'set_value', { entity_id: 'input_text.pika_status', value: `20.0,${now},20.0,${now}` });
  });

  // ==================== Vorschau Himmel-Extras ====================
  document.getElementById('meteor').addEventListener('click', () => cards.forEach((c) => c._meteor(false)));
  document.getElementById('bolide').addEventListener('click', () => cards.forEach((c) => c._meteor(true)));
  // Nacht an einem Juli-Abend, Pika bleibt wach (Glühwürmchen sind nur im Sommer zu sehen)
  document.getElementById('summernight').addEventListener('click', () => cards.forEach((c) => {
    const d = new Date();
    d.setMonth(6, 15);
    d.setHours(23, 0, 0, 0);
    c._dbgAz = 330;
    c._dbgElev = -25;
    c._dbgSleep = false;
    c._dbgDate = d.getTime();
    c._tick(); // _updateSky, Aufwachen und Glühwürmchen
  }));
  // Glühwürmchen zuschauen, wenn welche da sind, sonst einer frischen Sternschnuppe nachschauen
  document.getElementById('skywatch').addEventListener('click', () => cards.forEach((c) => {
    if (c._ffShown()) c._next = 'watchFireflies';
    else {
      c._meteor(false);
      c._next = 'watchMeteor';
    }
    c._interrupt();
  }));
  // ==================== Ende Vorschau Himmel-Extras ====================

  // ==================== Vorschau Festtage ====================
  // Stellt die Uhr der Karte (_dbgDate) auf eine passende Zeit des Festtags im aktuellen Jahr, dazu die Sonne
  // (Tag, Dämmerung, Nacht wach, Nacht schlafend). _dbgDate steht fest, die Uhr läuft also nicht weiter.
  (() => {
    const Y = new Date().getFullYear();
    const easter = (y) => {
      const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
      const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
      const n = h + l - 7 * m + 114;
      return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);
    };
    const E = easter(Y);
    const at = (y, mo, d, h, mi = 0, s = 0) => new Date(y, mo - 1, d, h, mi, s).getTime();
    const rel = (base, days, h, mi = 0) => new Date(base.getFullYear(), base.getMonth(), base.getDate() + days, h, mi).getTime();
    const xmas = new Date(Y, 11, 25);
    const adv4 = new Date(Y, 11, 25 - (xmas.getDay() || 7));
    const today = new Date();
    const SUN = { day: [180, 28, false], dusk: [250, -2, false], night: [300, -25, false], sleep: [330, -25, true] };
    const FEST = {
      halloween: [() => at(Y, 10, 31, 20), 'night'],
      martin: [() => at(Y, 11, 11, 17, 30), 'dusk'],
      advent: [() => rel(adv4, -14, 18), 'night'],
      nikolaus: [() => at(Y, 12, 6, 10), 'day'],
      heiligabend: [() => at(Y, 12, 24, 18, 30), 'night'],
      silvester: [() => at(Y, 12, 31, 23, 59), 'sleep'],
      mitternacht: [() => at(Y + 1, 1, 1, 0, 0, 5), 'sleep'],
      neujahr: [() => at(Y + 1, 1, 1, 12), 'day'],
      karneval: [() => rel(E, -48, 11, 11), 'day'],
      ostern: [() => rel(E, 0, 11), 'day'],
      mai: [() => at(Y, 5, 1, 12), 'day'],
      sommer: [() => at(Y, 6, 21, 15), 'day'],
      geburtstag: [() => at(today.getFullYear(), today.getMonth() + 1, today.getDate(), 15), 'day'],
    };
    const pad = (n) => String(n).padStart(2, '0');
    document.querySelectorAll('[data-fest]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const k = btn.dataset.fest;
        for (const c of cards) {
          if (k === 'heute') {
            c._dbgDate = c._dbgSleep = c._dbgElev = c._dbgAz = null;
          } else {
            const [ts, sun] = FEST[k];
            const [az, el, sleep] = SUN[sun];
            c._dbgDate = ts();
            c._dbgAz = az;
            c._dbgElev = el;
            c._dbgSleep = sleep;
          }
          if (k === 'geburtstag') {
            c.setConfig({ name: 'Pika', entity: 'input_text.pika_status', appliances: c._cfg?.appliances, coffee: c._cfg?.coffee, birthdays: [{ name: 'Mia', date: `${pad(today.getMonth() + 1)}-${pad(today.getDate())}` }] });
          }
          if (k === 'mitternacht') c._festMidY = null; // Finale und Aufwachen bei jedem Klick
          c._tick(); // ruft auch c._tickFest()
          if (k === 'halloween') c._festBat();
          if (k === 'karneval') c._festConfettiRain();
        }
        const d = cards[0]._dbgDate;
        log(`Festtage: ${d ? new Date(d).toLocaleString('de-DE') : 'heute'} → ${Object.keys(cards[0]._fest).filter((x) => x !== 'year').join(', ') || '—'}`);
      })
    );
    // Passende Aktion sofort (schläft er, wacht er fürs Feuerwerk auf)
    document.getElementById('fest-act').addEventListener('click', () => cards.forEach((c) => {
      const acts = c._festActs({ wx: c._wx, g: 100 }).map(([, n]) => n);
      if (!acts.length) return;
      if (c._asleep) {
        if (acts.includes('festFireworks')) c._festForce('festFireworks');
      } else {
        c._next = acts[0];
        c._interrupt();
      }
    }));
    document.getElementById('fest-rocket').addEventListener('click', () => cards.forEach((c) => c._festRocket()));
    document.getElementById('fest-confetti').addEventListener('click', () => cards.forEach((c) => c._festConfettiRain()));
    document.getElementById('fest-bat').addEventListener('click', () => cards.forEach((c) => c._festBat()));
  })();
  // ==================== Ende Vorschau Festtage ====================

  // ==================== Vorschau Freund-Pika ====================
  // Pino kommt sofort (auch bei Regen oder nachts) bzw. geht mit Abschied; Spiele nur, solange er da ist
  document.getElementById('fr-come').addEventListener('click', () => cards.forEach((c) => c._friendCome(undefined, undefined, true)));
  document.getElementById('fr-go').addEventListener('click', () => cards.forEach((c) => c._friendLeave(true)));
  document.querySelectorAll('[data-fr]').forEach((b) =>
    b.addEventListener('click', () => cards.forEach((c) => {
      if (c._fr?.arrived && !c._fr.leaving) { c._next = b.dataset.fr; c._interrupt(); }
    }))
  );
  // ==================== Ende Vorschau Freund-Pika ====================

  // ==================== Vorschau Haus-Bote ====================
  // Home-Connect-Sensoren wie beim echten Haus: last_changed ändert sich nur, wenn sich der Zustand ändert (dann
  // "jetzt"), attributes mit Einheit bzw. device_class. Nur der Startzustand "aus" liegt lange zurück.
  const HB = {
    washer: { type: 'washer', state: 'sensor.waschmaschine_betriebszustand', progress: 'sensor.waschmaschine_programm_fortschritt', end: 'sensor.waschmaschine_programm_endzeit' },
    dryer: { type: 'dryer', state: 'sensor.trockner_betriebszustand', progress: 'sensor.trockner_programm_fortschritt', end: 'sensor.trockner_programm_endzeit' },
    dishwasher: { type: 'dishwasher', state: 'sensor.geschirrspuler_betriebszustand', progress: 'sensor.geschirrspuler_programm_fortschritt',
      end: 'sensor.geschirrspuler_programm_endzeit', door: 'sensor.geschirrspuler_tur' },
  };
  const hbAgo = (min) => new Date(Date.now() - min * 60000).toISOString();
  const hbSet = (id, state, attributes = {}, min = 0) => {
    const o = states[id];
    const same = o && o.state === state && min === 0;
    states[id] = { state, attributes, last_changed: same ? o.last_changed : hbAgo(min), last_updated: hbAgo(min) };
  };
  const HB_PCT = { unit_of_measurement: '%' };
  const HB_TS = { device_class: 'timestamp' };
  for (const d of Object.values(HB)) {
    hbSet(d.state, 'inactive', {}, 180);
    hbSet(d.progress, 'unavailable', {}, 180);
    hbSet(d.end, 'unavailable', {}, 180);
    if (d.door) hbSet(d.door, 'closed', {}, 180);
  }
  cards.forEach((c) => c.setConfig({ name: 'Pika', entity: 'input_text.pika_status', appliances: Object.values(HB) }));
  push();
  const HB_ACT = { washer: 'boteStir', dryer: 'boteWatchDrum', dishwasher: 'boteDip' };
  const hbIdle = (d, st) => {
    hbSet(d.state, st);
    hbSet(d.progress, 'unavailable');
    hbSet(d.end, 'unavailable');
  };
  document.querySelectorAll('[data-hb]').forEach((b) =>
    b.addEventListener('click', () => {
      const [type, what] = b.dataset.hb.split(':');
      const d = HB[type];
      if (what === 'go') {
        cards.forEach((c) => {
          const a = c._bote?.list.find((o) => o.type === type);
          if (!a?.phase) return;
          c._boteFocus = type;
          c._next = a.phase === 'run' ? HB_ACT[type] : a.phase === 'done' ? 'boteNudge' : 'boteEmpty';
          c._interrupt();
        });
        return;
      }
      if (what.startsWith('run')) {
        const p = Number(what.slice(3));
        hbSet(d.state, 'run');
        hbSet(d.progress, String(p), HB_PCT);
        hbSet(d.end, new Date(Date.now() + (100 - p) * 1.4 * 60000).toISOString(), HB_TS);
        if (d.door) hbSet(d.door, 'closed');
      } else if (what === 'frac') {
        // Fortschritt als Anteil 0–1 ohne Einheit (andere Integrationen)
        hbSet(d.state, 'run');
        hbSet(d.progress, '0.45');
      } else if (what === 'rest') {
        // Restzeit als Zahl in Minuten statt Zeitstempel
        hbSet(d.state, 'run');
        hbSet(d.end, '25', { unit_of_measurement: 'min', device_class: 'duration' });
      } else if (what === 'done') {
        hbSet(d.state, 'finished');
        hbSet(d.progress, '100', HB_PCT);
        hbSet(d.end, 'unavailable');
        if (d.door) hbSet(d.door, 'closed');
      } else if (what === 'empty') {
        // Tür auf → Home Connect wechselt auf "ready"
        hbIdle(d, 'ready');
        if (d.door) hbSet(d.door, 'open');
      } else if (what === 'off') {
        hbIdle(d, 'inactive');
        if (d.door) hbSet(d.door, 'closed');
      } else if (what === 'abort') {
        // Abbruch: kurz "aborting", dann "ready" (darf nicht als ausgeräumt zählen)
        hbSet(d.state, 'aborting');
        setTimeout(() => (hbIdle(d, 'ready'), push()), 1500);
      } else if (what === 'on') {
        // Einschalten bzw. Tür zum Einräumen öffnen: inactive → ready (darf nicht als ausgeräumt zählen)
        hbIdle(d, 'ready');
      } else if (what === 'offline') {
        // WLAN weg: alle Sensoren des Geräts unavailable, das Requisit bleibt
        for (const id of [d.state, d.progress, d.end, d.door]) if (id) hbSet(id, 'unavailable');
      } else if (what === 'dooropen' || what === 'doorclose') {
        // Tür bei weiter "fertig" (Zustand bleibt): auf = ausgeräumt, zu ändert nichts mehr
        hbSet(d.door, what === 'dooropen' ? 'open' : 'closed');
      }
      push();
    })
  );
  // ==================== Ende Vorschau Haus-Bote ====================

  // ==================== Vorschau Kaffee ====================
  // Wie Home Connect: Beim Bezug springt das aktive Programm auf das Getränk und der Tassenzähler zählt hoch,
  // nach dem Bezug (hier 18 s statt ~100 s) steht das Programm wieder auf "unknown".
  const CF = {
    active: 'select.kaffeevollautomat_aktives_programm',
    counter: 'sensor.kaffeevollautomat_kaffee_und_milchtassen',
    selected: 'select.kaffeevollautomat_ausgewahltes_programm',
  };
  const CF_P = (d) => `consumer_products_coffee_maker_program_beverage_${d}`;
  let cfCups = 1245;
  let cfT = 0;
  hbSet(CF.active, 'unknown', {}, 300);
  hbSet(CF.counter, String(cfCups), { unit_of_measurement: 'cups' }, 300);
  hbSet(CF.selected, CF_P('latte_macchiato'), {}, 300);
  cards.forEach((c) => c.setConfig({ name: 'Pika', entity: 'input_text.pika_status', appliances: c._cfg?.appliances, coffee: CF }));
  push();
  const cfReset = () => {
    try { localStorage.removeItem('pika-pet-coffee'); } catch {}
    cards.forEach((c) => { c._cof = null; c._cofA = c._cofN = c._cofS = undefined; });
  };
  const cfStart = (drink, agoMin = 0) => {
    clearTimeout(cfT);
    hbSet(CF.selected, CF_P(drink), {}, agoMin);
    hbSet(CF.active, CF_P(drink), {}, agoMin);
    hbSet(CF.counter, String(++cfCups), { unit_of_measurement: 'cups' }, agoMin);
  };
  const cfEnd = (agoMin = 0) => hbSet(CF.active, 'unknown', {}, agoMin);
  const cfDrink = () => states[CF.selected].state.split('beverage_')[1];
  document.querySelectorAll('[data-cf]').forEach((b) =>
    b.addEventListener('click', () => {
      cfStart(b.dataset.cf);
      push();
      log(`Kaffee: ${b.dataset.cf} läuft (18 s)`);
      cfT = setTimeout(() => (cfEnd(), push(), log('Kaffee: fertig')), 18000);
    })
  );
  document.getElementById('cf-fast').addEventListener('click', () => {
    if (!/beverage/.test(states[CF.active].state)) cfStart(cfDrink(), 0.5);
    else states[CF.active].last_changed = states[CF.counter].last_changed = new Date(Date.now() - 30000).toISOString();
    clearTimeout(cfT);
    cfEnd();
    push();
    log('Kaffee: fertig');
  });
  // Karte neu geladen: Bezug lief vor 5 Min., fertig vor 3 Min.; was schon getrunken ist, vergessen
  document.getElementById('cf-reload').addEventListener('click', () => {
    cfReset();
    cfStart(cfDrink(), 5);
    cfEnd(3);
    push();
    log('Kaffee: Neuladen, Bezug vor 3 Min fertig');
  });
  // Neustart: alle last_changed gleichzeitig jetzt – darf nicht als Bezug zählen
  document.getElementById('cf-restart').addEventListener('click', () => {
    cfReset();
    const t = new Date().toISOString();
    for (const id of Object.values(CF)) states[id] = { ...states[id], last_changed: t, last_updated: t };
    push();
    log('Kaffee: HA-Neustart simuliert');
  });
  // ==================== Ende Vorschau Kaffee ====================

  // ==================== Aktivitäten ====================
  document.querySelectorAll('[data-act]').forEach((b) =>
    b.addEventListener('click', () => cards.forEach((c) => { c._next = b.dataset.act; c._interrupt(); }))
  );
  document.getElementById('act-show').addEventListener('click', () => cards.forEach((c) => { c._showAt = 0; c._showReq(); }));
  document.getElementById('act-mood').addEventListener('click', () => {
    const c = cards[0];
    const tf = c._tagesform();
    const min = (t) => (t == null ? '–' : t <= Date.now() ? 'jetzt' : `in ${Math.round((t - Date.now()) / 6e4)} Min`);
    log(`Tagesform: Lieblinge ${tf.fav.join(', ')}, keine Lust auf ${tf.meh} · zuletzt ${c._actRecent().join(', ') || '–'} · `
      + `groß ${min(c._hobbyNext)}, klein ${min(c._miniNext)} · Frühsport fällig: ${c._sportDue() ? 'ja' : 'nein'}`);
  });
  // ==================== Ende Aktivitäten ====================
</script>
</body>
</html>
