<script>
  // Die Karte gibt ihre reinen Funktionen heraus, wenn es __pikaTest gibt (wie für die Tests). Die Zeile Chronik
  // braucht daraus die Schreibweise der beiden Helfer, um vergangene Tage in den Verlauf zu legen.
  window.__pikaTest = (x) => (window.PIKA = x);
</script>
<script src="pika-pet-card.js"></script>
<script>
  const log = (t) => (document.getElementById('log').textContent = t);
  const states = {
    // last_updated wie in HA (dort ändert sich sun.sun alle paar Minuten): Daran erkennt die Chronik, dass HA den
    // heutigen Tag erreicht hat, ohne Stempel prüfte sie in der Vorschau nie von selbst
    'sun.sun': { state: 'above_horizon', last_updated: new Date().toISOString(), attributes: {
      elevation: 28, azimuth: 180,
      // Uhrzeiten für sleep_start/sleep_end: heute 07:56 und 18:33 Ortszeit (Datum egal, zählt nur die Uhrzeit)
      next_rising: new Date(new Date().setHours(7, 56, 0, 0)).toISOString(),
      next_setting: new Date(new Date().setHours(18, 33, 0, 0)).toISOString(),
    } },
    'weather.forecast_home': {
      state: 'partlycloudy',
      attributes: { temperature: 14, temperature_unit: '°C', cloud_coverage: 40, wind_speed: 12, wind_speed_unit: 'km/h', wind_bearing: 240 },
    },
    // leer wie ein frisch angelegter Helfer (bei "unknown" wartet die Karte 20 s, ob es nur der Start von HA ist)
    'input_text.pika_status': { state: '', attributes: {} },
    // Tagesplan (Vorrat, Frühsport, Verlauf der Beschäftigungen), beide Karten teilen ihn wie zwei Geräte
    'input_text.pika_plan': { state: '', attributes: { max: 255 } },
  };
  const cards = [document.getElementById('a'), document.getElementById('b')];
  // Verlauf wie der Recorder von HA: jede Änderung mit Zeitstempel. Daraus liest die Karte ihr Tagebuch
  // (history/history_during_period, Antwort je Entity [{ s, lu }]).
  const hist = {};
  const histAdd = (id, s) => (hist[id] ||= []).push({ s, lu: Date.now() / 1000 });

  // To-do-Liste für die Chronik (chronicle_entity), mit dem Verhalten, das an local_todo von HA gemessen ist. Beide
  // Karten teilen sie wie die Helfer. Die Liste vergibt die Kennung (uid) selbst, add_item antwortet ohne sie; der
  // Titel wird getrimmt, ein leerer abgelehnt; eine unbekannte uid wird abgelehnt (als schlichtes Objekt, nicht als
  // Error), und von einer Liste von uids wird alles gelöscht oder nichts. Der Zustand der Entität ist die Zahl der
  // offenen Einträge: Nur wenn die sich ändert, gibt es in HA ein state_changed, also eine Zeile im Recorder.
  // Jeder Aufruf antwortet erst nach etwa 150 ms. So lesen zwei Karten, die im selben Augenblick prüfen, beide die
  // Liste, bevor eine schreibt, und legen denselben Tag doppelt an: die Dopplung, die das Nachprüfen wieder abräumt.
  const CHR = 'todo.pikas_chronik';
  const todo = { items: [], calls: [], rows: 0 }; // calls: Protokoll { t, wer, txt }, rows: Recorder-Zeilen der Liste
  const todoEntity = () => {
    const open = String(todo.items.filter((x) => x.status === 'needs_action').length);
    if (states[CHR]?.state === open) return false;
    const t = new Date().toISOString();
    states[CHR] = { state: open, attributes: { friendly_name: 'Pikas Chronik', supported_features: 127 }, last_changed: t, last_updated: t };
    return true;
  };
  todoEntity();
  const todoUid = () => Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
  const todoKurz = (uid) => String(uid).slice(0, 8);
  const todoFind = (item) => todo.items.find((x) => x.uid === item) || todo.items.find((x) => x.summary === item);
  // „Gibt es nicht“ sagt HA auf zwei Arten (beide gemessen). Wurde der Eintrag eben erst gelöscht (hier: in der
  // letzten Sekunde, etwa von der anderen Karte beim Abräumen derselben Dopplung), kennt HAs gemerkter Stand der
  // Liste ihn noch, und erst der Speicher scheitert: unknown_error. Sonst: service_validation_error.
  const todoGone = new Map(); // uid → wann gelöscht
  const todoMiss = (item) => (Date.now() - (todoGone.get(item) ?? -Infinity) < 1000
    ? { code: 'unknown_error', message: `No existing item with uid/recurrence_id: ${item}/None` }
    : { code: 'service_validation_error', message: `Validation error: Unable to find to-do list item: ${item}` });
  // Ein Dienst der Liste. → Text fürs Protokoll; wirft, was HA ablehnt
  const todoService = (service, d, id) => {
    if (id !== CHR) throw { code: 'not_found', message: 'Entity not found' };
    if (service === 'add_item') {
      const summary = String(d.item ?? '').trim();
      if (!summary) throw { code: 'invalid_format', message: 'string value is empty' };
      const it = { summary, uid: todoUid(), status: 'needs_action' };
      if (d.description) it.description = String(d.description);
      if (d.due_date) it.due = String(d.due_date);
      todo.items.push(it);
      return `„${summary}“ (bekommt ${todoKurz(it.uid)})`;
    }
    if (service === 'update_item') {
      const x = todoFind(d.item);
      if (!x) throw todoMiss(d.item);
      if (d.rename != null) x.summary = String(d.rename).trim();
      if (d.status != null) {
        x.status = d.status === 'completed' ? 'completed' : 'needs_action';
        // wie in HA: ein abgehakter Eintrag trägt den Zeitpunkt des Abhakens
        if (x.status === 'completed') x.completed = new Date().toISOString();
        else delete x.completed;
      }
      if (d.description != null) {
        if (d.description) x.description = String(d.description);
        else delete x.description;
      }
      return `${d.rename != null ? `→ „${x.summary}“` : ''}${d.status != null ? ` ${x.status}` : ''}${d.description != null ? ' Beschreibung' : ''}`.trim();
    }
    if (service === 'remove_item') {
      const ids = [d.item].flat();
      const miss = ids.find((i) => !todoFind(i));
      if (miss !== undefined) throw todoMiss(miss);
      const xs = ids.map(todoFind);
      for (const x of xs) todoGone.set(x.uid, Date.now());
      todo.items = todo.items.filter((x) => !xs.includes(x));
      return '';
    }
    throw { code: 'not_found', message: `Service todo.${service} not found` };
  };
  // wer: 'A' (linke Karte), 'B' (rechte) oder 'Mensch'. tun() → [Antwort, Text fürs Protokoll]
  const todoCall = (wer, was, tun) => new Promise((ok, nein) => setTimeout(() => {
    let r = null;
    let err = null;
    try {
      r = tun();
    } catch (e) {
      err = e;
    }
    todo.calls.push({ t: Date.now(), wer, txt: err ? `${was} → abgelehnt: ${err?.message ?? err}` : `${was} ${r[1]}`.trim() });
    if (todo.calls.length > 60) todo.calls.shift();
    if (todoEntity()) {
      todo.rows++;
      push();
    }
    chrShow();
    if (err) nein(err);
    else ok(r[0]);
  }, 130 + Math.random() * 40));

  const hass = {
    states,
    // time_zone: die Zone des Browsers. Die Chronik schreibt nur auf Geräten, deren Ortszeit zur Zone von HA passt;
    // mit einer festen Zone wäre sie in der Vorschau je nach Rechner aus.
    config: { latitude: 50.06, longitude: 8.69, time_zone: Intl.DateTimeFormat().resolvedOptions().timeZone },
    callWS(msg, wer = '?') {
      if (msg.type === 'todo/item/list') {
        return todoCall(wer, 'todo/item/list', () => {
          if (msg.entity_id !== CHR) throw { code: 'not_found', message: 'Entity not found' };
          return [{ items: todo.items.map((x) => ({ ...x })) }, `→ ${todo.items.length} Einträge`];
        });
      }
      if (msg.type !== 'history/history_during_period') return Promise.reject(new Error('unknown_command'));
      const from = Date.parse(msg.start_time) / 1000;
      const out = {};
      for (const id of msg.entity_ids) {
        const all = hist[id] || [];
        const before = all.filter((r) => r.lu < from).pop();
        out[id] = [...(before ? [{ ...before, lu: from }] : []), ...all.filter((r) => r.lu >= from)];
      }
      return Promise.resolve(out);
    },
    // Wie im Frontend von HA: callService(domain, service, serviceData, target, notifyOnError = true, returnResponse).
    // Mit notifyOnError zeigt HA bei einer Ablehnung zehn Sekunden lang eine Meldung am Bildschirm; die Chronik
    // übergibt darum false. Tut sie es nicht, steht es als Hinweis im Protokoll.
    callService(domain, service, data, target, notifyOnError = true, returnResponse = false, wer = '?') {
      // To-do-Liste: eigene Dienste mit dem Ziel im vierten Parameter, kein Text-Helfer. Antwort ohne uid.
      if (domain === 'todo') {
        // (im Protokoll: welcher Eintrag gemeint ist, Kennung gekürzt)
        const item = service === 'add_item' || data?.item == null ? '' : ` ${[data.item].flat().map(todoKurz).join(', ')}`;
        const laut = notifyOnError === false ? '' : ' [ohne notifyOnError = false: HA zeigte bei einer Ablehnung eine Meldung]';
        return todoCall(wer, `todo.${service}${laut}${item}`, () =>
          [{ context: { id: todoUid(), parent_id: null, user_id: null } }, todoService(service, data || {}, target?.entity_id ?? data?.entity_id)]);
      }
      states[data.entity_id] = { state: data.value, attributes: states[data.entity_id]?.attributes || {} };
      histAdd(data.entity_id, data.value);
      log(`${domain}.${service} → ${data.value}`);
      setTimeout(push, 50);
      return Promise.resolve();
    },
  };
  // Jede Karte bekommt ihre eigene Sicht auf hass (alles wie dort, nur die Aufrufe tragen ihren Absender): So steht
  // im Protokoll der Chronik, welche Karte gelesen und welche geschrieben hat.
  const views = new WeakMap();
  const viewOf = (c) => {
    if (!views.has(c)) {
      const v = Object.create(hass);
      const wer = c.id.toUpperCase();
      v.callWS = (msg) => hass.callWS(msg, wer);
      v.callService = (domain, service, data, target, notifyOnError, returnResponse) => hass.callService(domain, service, data, target, notifyOnError, returnResponse, wer);
      views.set(c, v);
    }
    return views.get(c);
  };
  function push() {
    hass.states = { ...states };
    cards.forEach((c) => (c.hass = viewOf(c)));
  }
  cards.forEach((c) => c.setConfig({ name: 'Pika', entity: 'input_text.pika_status', plan_entity: 'input_text.pika_plan' }));
  push();

  // Prototyp Tiefe: Schalter (setConfig wie in HA), Spur erzwingen, Areal wechseln
  const tiefeBtn = document.getElementById('tiefe');
  const tiefeMark = () => (tiefeBtn.style.borderColor = cards[0]._cfg.depth ? '#6bb152' : '');
  tiefeBtn.addEventListener('click', () => {
    cards.forEach((c) => c.setConfig({ ...c._cfg, depth: !c._cfg.depth }));
    tiefeMark();
  });
  document.querySelectorAll('[data-lane]').forEach((b) => b.addEventListener('click', () => cards.forEach((c) => {
    if (!c._cfg.depth) c.setConfig({ ...c._cfg, depth: true });
    c._laneNext = Number(b.dataset.lane);
    c._next = 'wander';
    c._interrupt();
    tiefeMark();
  })));
  document.querySelectorAll('[data-areal]').forEach((b) => b.addEventListener('click', () =>
    cards.forEach((c) => c.setConfig({ ...c._cfg, areal: b.dataset.areal }))));

  document.querySelectorAll('[data-sun]').forEach((b) =>
    b.addEventListener('click', () => {
      const v = b.dataset.sun;
      for (const c of cards) {
        if (v === 'real') {
          c._dbgSleep = c._dbgElev = c._dbgAz = c._dbgDate = null;
        } else {
          const [az, el, sleep] = v.split(',').map(Number);
          c._dbgAz = az;
          c._dbgElev = el;
          c._dbgSleep = !!sleep;
          // Mond passend zur gewählten Tageszeit: heute, Stunde aus dem Azimut geschätzt
          const d = new Date();
          d.setHours(Math.round((az / 15 + 24) % 24), 0, 0, 0);
          c._dbgDate = d.getTime();
        }
        c._tick();
      }
    })
  );
  document.querySelectorAll('[data-wx]').forEach((b) =>
    b.addEventListener('click', () => {
      const w = states['weather.forecast_home'];
      const wind = b.dataset.wx === 'windy' ? 45 : b.dataset.wx === 'pouring' || b.dataset.wx.startsWith('lightning') ? 30 : 12;
      // last_changed wie in HA: seit wann die Lage gilt. Schnee „seit einer halben Stunde“, damit er gleich liegt
      // (frisch einsetzender Schneefall deckt die Wiese erst in zehn Minuten zu).
      const since = new Date(Date.now() - (b.dataset.wx === 'snowy' ? 30 * 60000 : 0)).toISOString();
      states['weather.forecast_home'] = { state: b.dataset.wx, last_changed: since, attributes: { ...w.attributes, wind_speed: wind, cloud_coverage: { sunny: 5, partlycloudy: 40 }[b.dataset.wx] ?? 90 } };
      push();
    })
  );
  // Wetterlage mit Vorgeschichte: zwei Meldungen nacheinander, wie sie HA über die Zeit geschickt hätte
  const wxStory = (steps) => {
    for (const [state, minAgo, attrs] of steps) {
      const w = states['weather.forecast_home'];
      states['weather.forecast_home'] = { state, last_changed: new Date(Date.now() - minAgo * 60000).toISOString(), attributes: { ...w.attributes, ...attrs } };
      push();
    }
  };
  // Es hat geschneit, seit fünf Stunden ist es bei 2 °C bewölkt: Die Decke ist gut halb getaut und taut weiter
  document.getElementById('thaw').addEventListener('click', () =>
    wxStory([['snowy', 420, { temperature: -1, cloud_coverage: 90 }], ['cloudy', 300, { temperature: 2, cloud_coverage: 80, wind_speed: 8 }]]));
  // Ein Schauer ist eben durchgezogen, die Sonne steht tief: Regenbogen (20 Minuten lang)
  document.getElementById('bow').addEventListener('click', () => {
    cards.forEach((c) => Object.assign(c, { _dbgAz: 240, _dbgElev: 18, _dbgSleep: false }));
    wxStory([['rainy', 25, { cloud_coverage: 90 }], ['partlycloudy', 2, { cloud_coverage: 40, wind_speed: 10 }]]);
    cards.forEach((c) => c._tick());
  });
  // Niederschlagssensor: "rainy" zeigt erst ab rain_min (0,3 mm/h) Regen
  document.querySelectorAll('[data-mm]').forEach((b) =>
    b.addEventListener('click', () => {
      const mm = b.dataset.mm;
      states['sensor.niederschlag'] = { state: mm, attributes: { unit_of_measurement: 'mm/h' } };
      cards.forEach((c) => (c._cfg.precip_entity = mm ? 'sensor.niederschlag' : null));
      log(mm ? `Niederschlag ${mm} mm/h` : 'ohne Niederschlagssensor');
      push();
    })
  );
  document.getElementById('cold').addEventListener('click', () => {
    const w = states['weather.forecast_home'];
    states['weather.forecast_home'] = { ...w, last_updated: new Date().toISOString(), attributes: { ...w.attributes, temperature: w.attributes.temperature < 3 ? 14 : -2 } }; // neue Meldung, dieselbe Lage
    push();
  });
  document.getElementById('burrow').addEventListener('click', () => cards.forEach((c) => { c._next = 'burrow'; c._interrupt(); }));
  document.getElementById('lookout').addEventListener('click', () => cards.forEach((c) => { c._next = 'lookout'; c._interrupt(); }));
  document.getElementById('gather').addEventListener('click', () => cards.forEach((c) => { if (c._flowers.length) { c._next = 'gather'; c._interrupt(); } }));
  // Häufchen: die Karte rechnet sie aus der Uhrzeit, also die Uhr der Häufchen vorstellen
  const shift = (ms) => cards.forEach((c) => {
    c._dbgShift = ms == null ? 0 : c._dbgShift + ms;
    c._poopCache = null;
    c._renderStats();
  });
  document.getElementById('poo1').addEventListener('click', () => {
    const c = cards[0];
    const n = c._stats && c._poopTimes(c._stats.c, c._now() + 864e5).find((t) => t > c._now());
    if (n) shift(n - cards[0]._now() + 1000);
  });
  document.getElementById('poo4').addEventListener('click', () => shift(4 * 36e5));
  document.getElementById('poo24').addEventListener('click', () => shift(24 * 36e5));
  document.getElementById('clock').addEventListener('click', () => shift(null));
  document.getElementById('sniff').addEventListener('click', () => cards.forEach((c) => { if (c._pileEls.size) { c._next = 'sniff'; c._interrupt(); } }));
  document.getElementById('clean').addEventListener('click', () => {
    const c = cards[0];
    [...c._pileEls.keys()].forEach((k, i) => setTimeout(() => c._cleanPile(k), i * 250));
  });
  // Besuch sofort, auch wenn Wetter oder Tageszeit es sonst nicht erlauben würden
  const CRITTERS = ['bird', 'mouse', 'frog', 'snail'];
  for (const k of CRITTERS) document.getElementById(k).addEventListener('click', () => cards.forEach((c) => c._visit(k, c._critId, true)));
  // Besuche werden aus der Uhr berechnet: Besuchsuhr aller Karten (_dbgShiftMs) 5 s vor den nächsten Start stellen
  const visitAt = (c, kind) => {
    if (kind !== 'friend') return c._critNext(kind, c._visitNow() + 1000).at;
    // Pino: läuft gerade einer, den danach
    const save = c._dbgShiftMs;
    let s = c._friendSchedule();
    if (!s.nextInMs) {
      c._dbgShiftMs += s.stayMs + 1000;
      s = c._friendSchedule();
    }
    const at = c._visitNow() + s.nextInMs;
    c._dbgShiftMs = save;
    return at;
  };
  document.querySelectorAll('[data-next]').forEach((b) =>
    b.addEventListener('click', () => {
      const k = b.dataset.next;
      const c0 = cards[0];
      let shift = 0;
      if (k !== 'real') {
        const kinds = k === 'any' ? ['bird', 'mouse', 'friend'] : [k];
        const [at, kind] = kinds.map((x) => [visitAt(c0, x), x]).sort((a, z) => a[0] - z[0])[0];
        shift = c0._dbgShiftMs + (at - 5000 - c0._visitNow());
        log(`Besuchsuhr → ${new Date(at - 5000).toLocaleTimeString('de-DE')}, ${kind} um ${new Date(at).toLocaleTimeString('de-DE')}`);
      } else log('Besuchsuhr: echte Zeit');
      for (const c of cards) {
        c._dbgShiftMs = shift;
        c._critLast = {}; // die Uhr springt (auch zurück): gemerkte Besuche gelten nicht mehr
        c._restartCritters();
        // Pino bleibt, wenn nur Vogel, Maus, Frosch oder Schnecke vorgezogen werden (beides zusammen ansehen)
        if (CRITTERS.includes(k)) continue;
        c._frUsed = 0;
        c._friendStop();
        c._friendPlan();
      }
    })
  );
  document.getElementById('watch').addEventListener('click', () => cards.forEach((c) => {
    const n = c._bird?.sitting ? 'watchBird' : c._mouse?.out ? 'watchMouse' : c._frog?.out ? 'watchFrog' : c._snail?.out ? 'watchSnail' : null;
    if (n) { c._next = n; c._interrupt(); }
  }));
  // Flieger: wie die Flightradar24-Integration alle 20 s neue Positionen, raus aus 15 km = weg
  const HOME = hass.config;
  const KX = 111.32 * Math.cos((HOME.latitude * Math.PI) / 180);
  const DTM = { airport_destination_latitude: 50.0379, airport_destination_longitude: 8.5622 };
  const at = (e, n) => ({ latitude: HOME.latitude + n / 110.57, longitude: HOME.longitude + e / KX });
  const dist = (f) => Math.hypot((f.longitude - HOME.longitude) * KX, (f.latitude - HOME.latitude) * 110.57);
  const mk = (o) => ({ id: Math.random().toString(16).slice(2, 10), on_ground: 0, aircraft_category: 'Airplane', vertical_speed: 0, ...o });
  const FLIGHTS = {
    anflug: () => mk({ ...at(9, 1.6), heading: 243, altitude: 2600, ground_speed: 150, vertical_speed: -700, flight_number: 'W62736',
      airline_short: 'Wizz Air', airline_icao: 'WZZ', aircraft_model: 'Airbus A321-271NX', airport_origin_city: 'Katowice', airport_destination_city: 'Frankfurt', ...DTM }),
    abflug: () => mk({ ...at(-4, -0.9), heading: 63, altitude: 1500, ground_speed: 170, vertical_speed: 1800, flight_number: 'EW9542',
      airline_short: 'Eurowings', airline_icao: 'EWG', aircraft_model: 'Airbus A320-214', airport_origin_city: 'Frankfurt', airport_destination_city: 'Palma de Mallorca' }),
    reise: () => mk({ ...at(-12, 4), heading: 105, altitude: 37000, ground_speed: 470, flight_number: 'TK1724',
      airline_short: 'Turkish Airlines', airline_icao: 'THY', aircraft_model: 'Boeing 737-8F2', airport_origin_city: 'Amsterdam', airport_destination_city: 'Istanbul' }),
    heli: () => mk({ ...at(4, -1), heading: 275, altitude: 900, ground_speed: 110, flight_number: '', callsign: 'CHX8',
      aircraft_category: 'Helicopter', aircraft_model: 'Airbus Helicopters H135', airline_short: 'ADAC Luftrettung' }),
    // zwei auf derselben Linie in gleicher Höhe, die sich in etwa 30 s mitten im Bild begegnen
    begegnung: () => [
      mk({ ...at(2.7, 0), heading: 270, altitude: 2500, ground_speed: 170, flight_number: 'EW1234',
        airline_short: 'Eurowings', airline_icao: 'EWG', aircraft_model: 'Airbus A320-214', airport_origin_city: 'Munich', airport_destination_city: 'London' }),
      mk({ ...at(-2.7, 0), heading: 90, altitude: 2500, ground_speed: 170, flight_number: 'LH2020',
        airline_short: 'Lufthansa', airline_icao: 'DLH', aircraft_model: 'Airbus A321-131', airport_origin_city: 'London', airport_destination_city: 'Munich' }),
    ],
    cessna: () => mk({ ...at(-6, 3), heading: 80, altitude: 2200, ground_speed: 95, flight_number: '', callsign: 'DEABC',
      aircraft_model: 'Cessna 172S Skyhawk', airport_origin_city: 'Marl', airport_destination_city: 'Paderborn' }),
  };
  let flights = [];
  function pushFlights() {
    states['sensor.flightradar24_current_in_area'] = { state: String(flights.length), attributes: { flights }, last_updated: new Date().toISOString() };
    push();
  }
  setInterval(() => {
    if (!flights.length) return;
    flights = flights.map((f) => {
      const v = ((f.ground_speed * 1.852) / 3600) * 20;
      const h = (f.heading * Math.PI) / 180;
      return { ...f, latitude: f.latitude + (v * Math.cos(h)) / 110.57, longitude: f.longitude + (v * Math.sin(h)) / KX,
        altitude: Math.max(0, f.altitude + f.vertical_speed / 3) };
    }).filter((f) => dist(f) <= 15);
    pushFlights();
  }, 20000);
  document.querySelectorAll('[data-fl]').forEach((b) =>
    b.addEventListener('click', () => {
      flights = b.dataset.fl === 'none' ? [] : flights.concat(FLIGHTS[b.dataset.fl]());
      pushFlights();
    })
  );
  // Beschäftigung sofort, auch ohne passendes Wetter (Drachen fliegt dann mit der Windrichtung aus dem Wetter)
  document.querySelectorAll('[data-hob]').forEach((b) =>
    b.addEventListener('click', () => cards.forEach((c) => {
      const h = b.dataset.hob;
      c._dbgDoze = h === 'doze';
      c._next = h === 'doze' ? 'read' : h;
      c._interrupt();
    }))
  );
  document.getElementById('hungry').addEventListener('click', () => {
    const now = Math.round(Date.now() / 1000);
    hass.callService('input_text', 'set_value', { entity_id: 'input_text.pika_status', value: `20.0,${now},20.0,${now}` });
  });

  // ==================== Vorschau Himmel-Extras ====================
  document.getElementById('meteor').addEventListener('click', () => cards.forEach((c) => c._meteor(false)));
  document.getElementById('bolide').addEventListener('click', () => cards.forEach((c) => c._meteor(true)));
  // Nacht an einem Juli-Abend, Pika bleibt wach (Glühwürmchen sind nur im Sommer zu sehen)
  document.getElementById('summernight').addEventListener('click', () => cards.forEach((c) => {
    const d = new Date();
    d.setMonth(6, 15);
    d.setHours(23, 0, 0, 0);
    c._dbgAz = 330;
    c._dbgElev = -25;
    c._dbgSleep = false;
    c._dbgDate = d.getTime();
    c._tick(); // _updateSky, Aufwachen und Glühwürmchen
  }));
  // Glühwürmchen zuschauen, wenn welche da sind, sonst einer frischen Sternschnuppe nachschauen
  document.getElementById('skywatch').addEventListener('click', () => cards.forEach((c) => {
    if (c._ffShown()) c._next = 'watchFireflies';
    else {
      c._meteor(false);
      c._next = 'watchMeteor';
    }
    c._interrupt();
  }));
  // ==================== Ende Vorschau Himmel-Extras ====================

  // ==================== Vorschau Festtage ====================
  // Stellt die Uhr der Karte (_dbgDate) auf eine passende Zeit des Festtags im aktuellen Jahr, dazu die Sonne
  // (Tag, Dämmerung, Nacht wach, Nacht schlafend). _dbgDate steht fest, die Uhr läuft also nicht weiter.
  (() => {
    const Y = new Date().getFullYear();
    const easter = (y) => {
      const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
      const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
      const n = h + l - 7 * m + 114;
      return new Date(y, Math.floor(n / 31) - 1, (n % 31) + 1);
    };
    const E = easter(Y);
    const at = (y, mo, d, h, mi = 0, s = 0) => new Date(y, mo - 1, d, h, mi, s).getTime();
    const rel = (base, days, h, mi = 0) => new Date(base.getFullYear(), base.getMonth(), base.getDate() + days, h, mi).getTime();
    const xmas = new Date(Y, 11, 25);
    const adv4 = new Date(Y, 11, 25 - (xmas.getDay() || 7));
    const today = new Date();
    const SUN = { day: [180, 28, false], dusk: [250, -2, false], night: [300, -25, false], sleep: [330, -25, true] };
    const FEST = {
      halloween: [() => at(Y, 10, 31, 20), 'night'],
      martin: [() => at(Y, 11, 11, 17, 30), 'dusk'],
      advent: [() => rel(adv4, -14, 18), 'night'],
      nikolaus: [() => at(Y, 12, 6, 10), 'day'],
      heiligabend: [() => at(Y, 12, 24, 18, 30), 'night'],
      silvester: [() => at(Y, 12, 31, 23, 59), 'sleep'],
      mitternacht: [() => at(Y + 1, 1, 1, 0, 0, 5), 'sleep'],
      neujahr: [() => at(Y + 1, 1, 1, 12), 'day'],
      karneval: [() => rel(E, -48, 11, 11), 'day'],
      ostern: [() => rel(E, 0, 11), 'day'],
      mai: [() => at(Y, 5, 1, 12), 'day'],
      sommer: [() => at(Y, 6, 21, 15), 'day'],
      geburtstag: [() => at(today.getFullYear(), today.getMonth() + 1, today.getDate(), 15), 'day'],
    };
    const pad = (n) => String(n).padStart(2, '0');
    document.querySelectorAll('[data-fest]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const k = btn.dataset.fest;
        for (const c of cards) {
          if (k === 'heute') {
            c._dbgDate = c._dbgSleep = c._dbgElev = c._dbgAz = null;
          } else {
            const [ts, sun] = FEST[k];
            const [az, el, sleep] = SUN[sun];
            c._dbgDate = ts();
            c._dbgAz = az;
            c._dbgElev = el;
            c._dbgSleep = sleep;
          }
          if (k === 'geburtstag') {
            c.setConfig({ name: 'Pika', entity: 'input_text.pika_status', plan_entity: 'input_text.pika_plan', appliances: c._cfg?.appliances, coffee: c._cfg?.coffee, birthdays: [{ name: 'Mia', date: `${pad(today.getMonth() + 1)}-${pad(today.getDate())}` }] });
          }

  // ==================== Vorschau Haus-Bote ====================
  // Home-Connect-Sensoren wie beim echten Haus: last_changed ändert sich nur, wenn sich der Zustand ändert (dann
  // "jetzt"), attributes mit Einheit bzw. device_class. Nur der Startzustand "aus" liegt lange zurück.
  const HB = {
    washer: { type: 'washer', state: 'sensor.waschmaschine_betriebszustand', progress: 'sensor.waschmaschine_programm_fortschritt', end: 'sensor.waschmaschine_programm_endzeit' },
    dryer: { type: 'dryer', state: 'sensor.trockner_betriebszustand', progress: 'sensor.trockner_programm_fortschritt', end: 'sensor.trockner_programm_endzeit' },
    dishwasher: { type: 'dishwasher', state: 'sensor.geschirrspuler_betriebszustand', progress: 'sensor.geschirrspuler_programm_fortschritt',
      end: 'sensor.geschirrspuler_programm_endzeit', door: 'sensor.geschirrspuler_tur' },
  };
  const hbAgo = (min) => new Date(Date.now() - min * 60000).toISOString();
  const hbSet = (id, state, attributes = {}, min = 0) => {
    const o = states[id];
    const same = o && o.state === state && min === 0;
    states[id] = { state, attributes, last_changed: same ? o.last_changed : hbAgo(min), last_updated: hbAgo(min) };
    if (!same) histAdd(id, state);
  };
  const HB_PCT = { unit_of_measurement: '%' };
  const HB_TS = { device_class: 'timestamp' };
  for (const d of Object.values(HB)) {
    hbSet(d.state, 'inactive', {}, 180);
    hbSet(d.progress, 'unavailable', {}, 180);
    hbSet(d.end, 'unavailable', {}, 180);
    if (d.door) hbSet(d.door, 'closed', {}, 180);
  }
  cards.forEach((c) => c.setConfig({ name: 'Pika', entity: 'input_text.pika_status', plan_entity: 'input_text.pika_plan', appliances: Object.values(HB) }));
  push();
  const HB_ACT = { washer: 'boteStir', dryer: 'boteWatchDrum', dishwasher: 'boteDip' };
  const hbIdle = (d, st) => {
    hbSet(d.state, st);
    hbSet(d.progress, 'unavailable');
    hbSet(d.end, 'unavailable');
  };
  document.querySelectorAll('[data-hb]').forEach((b) =>
    b.addEventListener('click', () => {
      const [type, what] = b.dataset.hb.split(':');
      const d = HB[type];
      if (what === 'go') {
        cards.forEach((c) => {
          const a = c._bote?.list.find((o) => o.type === type);
          if (!a?.phase) return;
          c._boteFocus = type;
          c._next = a.phase === 'run' ? HB_ACT[type] : a.phase === 'done' ? 'boteNudge' : 'boteEmpty';
          c._interrupt();
        });
        return;
      }
      if (what.startsWith('run')) {
        const p = Number(what.slice(3));
        hbSet(d.state, 'run');
        hbSet(d.progress, String(p), HB_PCT);
        hbSet(d.end, new Date(Date.now() + (100 - p) * 1.4 * 60000).toISOString(), HB_TS);
        if (d.door) hbSet(d.door, 'closed');
      } else if (what === 'frac') {
        // Fortschritt als Anteil 0–1 ohne Einheit (andere Integrationen)
        hbSet(d.state, 'run');
        hbSet(d.progress, '0.45');
      } else if (what === 'rest') {
        // Restzeit als Zahl in Minuten statt Zeitstempel
        hbSet(d.state, 'run');
        hbSet(d.end, '25', { unit_of_measurement: 'min', device_class: 'duration' });
      } else if (/^done\d+$/.test(what)) {
        // fertig seit … Minuten (Müffel-Wölkchen ab 30, Nase zuhalten ab 120)
        const m = Number(what.slice(4));
        hbSet(d.state, 'finished', {}, m);
        hbSet(d.progress, '100', HB_PCT, m);
        hbSet(d.end, 'unavailable', {}, m);
      } else if (what === 'selfready') {
        // Spülmaschine von Home Connect: eine Minute nach „fertig“ von selbst „ready“, die Tür bleibt zu
        hbSet(d.state, 'finished', {}, 1);
        hbSet(d.progress, '100', HB_PCT, 1);
        push();
        hbIdle(d, 'ready');
      } else if (what === 'doorblip') {
        hbSet(d.door, 'unavailable');
        push();
        hbSet(d.door, 'closed');
      } else if (what === 'done') {
        hbSet(d.state, 'finished');
        hbSet(d.progress, '100', HB_PCT);
        hbSet(d.end, 'unavailable');
        if (d.door) hbSet(d.door, 'closed');
      } else if (what === 'empty') {
        // Tür auf → Home Connect wechselt auf "ready"
        hbIdle(d, 'ready');
        if (d.door) hbSet(d.door, 'open');
      } else if (what === 'off') {
        hbIdle(d, 'inactive');
        if (d.door) hbSet(d.door, 'closed');
      } else if (what === 'abort') {
        // Abbruch: kurz "aborting", dann "ready" (darf nicht als ausgeräumt zählen)
        hbSet(d.state, 'aborting');
        setTimeout(() => (hbIdle(d, 'ready'), push()), 1500);
      } else if (what === 'on') {
        // Einschalten bzw. Tür zum Einräumen öffnen: inactive → ready (darf nicht als ausgeräumt zählen)
        hbIdle(d, 'ready');
      } else if (what === 'offline') {
        // WLAN weg: alle Sensoren des Geräts unavailable, das Requisit bleibt
        for (const id of [d.state, d.progress, d.end, d.door]) if (id) hbSet(id, 'unavailable');
      } else if (what === 'dooropen' || what === 'doorclose') {
        // Tür bei weiter "fertig" (Zustand bleibt): auf = ausgeräumt, zu ändert nichts mehr
        hbSet(d.door, what === 'dooropen' ? 'open' : 'closed');
      }
      push();
    })
  );

  // Zwei Bezüge kurz hintereinander: Der Espresso stellt sich hinten an (bis 0.35 verfiel er meist)

  // ==================== Ende Vorschau Kaffee ====================

    gift();
    if (!c._careToday().fed) c._onFeed();
    if (!c._careToday().pet) c._petCount();
    c._stats.s = Math.max(c._stats.s, 80);
    c._stats.g = Math.max(c._stats.g, 80);
    c._stats.st = c._stats.gt = c._haNow();
    c._save();
    setTimeout(() => { c._careEval(true); fairLog(); }, 500);
  });
  const goodAdd = (n) => {
    gift();
    const G = cards[0]._plan.gift;
    giftSet({ f: (G.f ?? 0) + n, ...(Math.floor(((G.f ?? 0) + n) / 7) > Math.floor((G.f ?? 0) / 7) ? { y: Math.min(2, G.y + 1) } : {}) });
    fairLog();
  };
  document.getElementById('good-1').addEventListener('click', () => goodAdd(1));
  document.getElementById('good-6').addEventListener('click', () => { gift(); giftSet({ f: 6 }); fairLog(); });
  document.getElementById('treat-run').addEventListener('click', () => {
    const z = [...Array(36).keys()].map((i) => (PIKA.giftTre(i + 1) ? 'S' : 'l')).join('');
    log(`Päckchen 1–36 (S Schatz, l Leckerli, solange noch ein Schatz fehlt): ${z} · längste Leckerli-Folge ${Math.max(...z.split('S').map((x) => x.length))}`);
  });
  // Stand setzen, dann verschenken. gdbg ist nicht wiederholbar und bliebe 15 s lang in den eigenen Änderungen: Kommt
  // in der Zeit der Stand mit dem Verschenkten zurück, setzte es ihn wieder auf den Vorschau-Stand. Darum erst aus
  // den Änderungen nehmen, wenn es im Helfer steht.
  const giftSetGive = (f) => {
    giftSet(f);
    setTimeout(() => {
      cards[0]._planOps = cards[0]._planOps.filter((o) => o.t !== 'gdbg');
      cards[0]._onGiftBtn();
    }, 1000);
  };
  document.getElementById('mile-10').addEventListener('click', () => giftSetGive({ z: 9, o: 9, n: Math.max(1, gift().n), u: 255, v: 0 }));
  // alle mit Trick, sieben golden, ein goldenes Päckchen im Vorrat: Das bringt den letzten
  document.getElementById('all-gold').addEventListener('click', () => giftSetGive({ u: 255, v: 255 | (0x7f << 8), y: 1, n: 0 }));
  document.getElementById('fair-state').addEventListener('click', fairLog);
  // ==================== Ende Faire Päckchen ====================

  // ==================== Tagebuch ====================
  // Echt: Füttern, Streicheln, Putzen, Päckchen und Beschäftigungen aus dem Plan („Uhr vor“) landen im Verlauf oben und
  // erscheinen unter Heute. „Verlauf −3 Std.“ / „−1 Tag“ schiebt alles Bisherige zurück (nach gestern).
  document.getElementById('diary-open').addEventListener('click', () => cards[0]._diaryOpen());
  document.getElementById('diary-tre').addEventListener('click', () => cards[0]._diaryOpen('schatz'));
  const histShift = (sec) => {
    Object.values(hist).forEach((a) => a.forEach((r) => (r.lu -= sec)));
    log(`Verlauf um ${sec / 3600} Std. zurückgeschoben`);
  };
  document.getElementById('diary-3h').addEventListener('click', () => histShift(3 * 3600));
  document.getElementById('diary-1d').addEventListener('click', () => histShift(24 * 3600));
  document.getElementById('diary-hist').addEventListener('click', () =>
    log(Object.entries(hist).map(([id, a]) => `${id}: ${a.length} Stände${a.length ? `, zuletzt ${new Date(a.at(-1).lu * 1000).toLocaleTimeString()}` : ''}`).join(' · ') || 'noch kein Verlauf'));
  document.getElementById('diary-stats').addEventListener('click', () => cards.forEach((c) => c.setConfig({ ...c._cfg, show_stats: !c._cfg.show_stats })));
  // Beispieltage: fertige Roh-Ereignisse statt des Verlaufs (zwei volle Tage, um die Seite zu beurteilen)
  const diaryDemo = (d0, d1, now) => {
    const at = (day, h, m = 0) => new Date(day).setHours(h, m, 0, 0);
    const pd = (t) => Math.floor((t - new Date(t).getTimezoneOffset() * 6e4 - 4 * 36e5) / 864e5);
    const ev = [];
    [d1, d0].forEach((day, i) => {
      ev.push(
        { t: at(day, 8, 20), k: 'act', a: 'sport', v: '' }, { t: at(day, 8, 50), k: 'mem', b: 'coffee' }, { t: at(day, 9, 5), k: 'feed' },
        { t: at(day, 9, 30), k: 'act', a: 'read', v: '' }, { t: at(day, 9, 50), k: 'act', a: 'game', v: '' }, { t: at(day, 10, 10), k: 'act', a: 'read', v: '' },
        { t: at(day, 10, 30), k: 'act', a: 'tablet', v: '' }, { t: at(day, 10, 40), k: 'mem', b: 'bird' },
        { t: at(day, 11, 40), k: 'hungry', eaten: true }, { t: at(day, 12, 5), k: 'feed' },
        { t: at(day, 12, 30), k: 'act', a: 'paint', v: i ? 'pino' : 'regenbogen' }, { t: at(day, 13, 10), k: 'parcel', it: i ? 1 : 9, what: i ? 'new' : 'treat', gold: false },
        { t: at(day, 13, 30), k: 'bote', type: 'washer', name: 'Waschmaschine' }, { t: at(day, 13, 45), k: 'clean', n: 2 }, { t: at(day, 13, 50), k: 'clean', n: 1, all: true },
        { t: at(day, 14, 20), k: 'mem', b: 'pino' }, { t: at(day, 14, 50), k: 'gather' }, { t: at(day, 15, 20), k: 'gather' },
        { t: at(day, 15, 40), k: 'flower', id: at(day, 15, 40), taken: !!i }, { t: at(day, 16, 0), k: 'act', a: 'music', v: '' },
        { t: at(day, 16, 20), k: 'mem', b: 'plane' }, { t: at(day, 16, 30), k: 'mem', b: 'heart' }, { t: at(day, 16, 40), k: 'feed' },
      );
    });
    const live = ev.filter((e) => e.t <= now);
    return { ev: live, stamps: live.map((e) => e.t), pets: { [pd(d1 + 36e5)]: 23, [pd(d0 + 36e5)]: 14 } };
  };
  document.getElementById('diary-demo').addEventListener('click', (e) => {
    const c = cards[0];
    c._dbgDiary = c._dbgDiary ? null : diaryDemo;
    e.target.style.borderColor = c._dbgDiary ? '#6bb152' : '';
    c._diaryClose();
    c._diaryOpen();
  });
  // ==================== Ende Tagebuch ====================

  // ==================== Chronik ====================
  // Standard: aus, dann fragt keine Karte nach der Liste. „Chronik an/aus“ setzt chronicle_entity an beiden Karten wie
  // im Editor. Danach prüfen sie beim nächsten Takt von selbst (einmal am Tag, gemerkt im Browser; bis zum Nachprüfen
  // vergehen wie in HA 30 bis 60 s). „beide prüfen“ erzwingt die Prüfung sofort und an beiden zugleich, mit 2 s bis
  // zum Nachprüfen: Unter der Karte steht, wie die Dopplung entsteht und wieder verschwindet.
  const chrBtn = document.getElementById('chr-on');
  const chrOut = document.getElementById('chr-out');
  const chrOn = () => !!cards[0]._cfg.chronicle_entity;
  const chrDay = (vor) => PIKA.chronikDatum(PIKA.pikaDay(cards[0]._haNow()) - vor);
  // Liste (uid gekürzt, Status, Titel) und die letzten Aufrufe. Leer, solange die Chronik aus und nichts geschehen ist.
  function chrShow() {
    const on = chrOn();
    chrBtn.style.borderColor = on ? '#6bb152' : '';
    if (!on && !todo.items.length && !todo.calls.length) return (chrOut.textContent = '');
    const zeit = (t) => `${new Date(t).toLocaleTimeString('de-DE')},${String(t % 1000).padStart(3, '0')}`;
    chrOut.textContent = [
      `${CHR} (Chronik ${on ? 'an' : 'aus'}): ${todo.items.length} Einträge, ${states[CHR].state} offen · Recorder-Zeilen der Liste bisher: ${todo.rows}`,
      ...todo.items.map((x) => `  ${todoKurz(x.uid)}  ${x.status.padEnd(12)}  ${x.summary}${x.description ? `  (Beschreibung: ${x.description})` : ''}`),
      ...(todo.items.length ? [] : ['  (leer)']),
      '',
      'Aufrufe an die Liste (A = linke Karte, B = rechte):',
      ...todo.calls.map((r) => `  ${zeit(r.t)}  ${r.wer.padEnd(6)}  ${r.txt}`),
    ].join('\n');
  }
  chrBtn.addEventListener('click', () => {
    const on = !chrOn();
    cards.forEach((c) => c.setConfig({ ...c._cfg, chronicle_entity: on ? CHR : null }));
    chrShow();
    log(on ? `Chronik an: ${CHR}` : 'Chronik aus');
  });
  // Vergangene Tage in den nachgestellten Verlauf der beiden Helfer legen, so wie ihn der Recorder geführt hätte.
  // Zurückschieben wie beim Tagebuch reicht hier nicht: Wann gefüttert und an welchem Tag gestreichelt wurde, steht im
  // Plan selbst. Die Stände bauen auf dem ersten echten Stand von heute auf (nur Futter, Streicheln, Erlebnisse,
  // Päckchen und Häufchen ändern sich), so entsteht am Übergang zu heute kein Ereignis, das es nicht gab.
  // vor wie vielen Tagen: gefüttert, gestreichelt, Erlebnisse (Bits: 16 Pino, 64 Vögelchen, 256 Schmetterling) …
  const CHR_TAGE = [
    [4, { futter: 1, streicheln: 3 }],
    [3, { futter: 2, streicheln: 7, mem: 64 }],
    [2, { futter: 3, streicheln: 12, mem: 16 | 64, paeckchen: 1, putzen: 2 }],
    [1, { futter: 1, streicheln: 4, mem: 256 }],
  ];
  const chrGen = new WeakSet(); // Stände, die dieser Knopf erzeugt hat (beim nächsten Mal ersetzt)
  document.getElementById('chr-past').addEventListener('click', () => {
    const T = PIKA;
    const sId = 'input_text.pika_status';
    const pId = 'input_text.pika_plan';
    const echt = (id) => (hist[id] || []).filter((r) => !chrGen.has(r));
    const sek = (t) => Math.round(t / 1000) * 1000;
    const heute = T.pikaDay(cards[0]._haNow());
    const t0 = sek(T.chronikStart(heute - CHR_TAGE[0][0]) - 36e5);
    let S = T.parseStats(echt(sId)[0]?.s ?? states[sId].state) || T.freshStats(t0);
    const P0 = T.planParse(echt(pId)[0]?.s ?? states[pId].state) || T.planBlank(t0);
    let P = { ...P0, fd: [], cute: { d: heute - CHR_TAGE[0][0] - 1, n: 0, m: 0 },
      gift: P0.gift || { k: t0, a: 1, p: t0, n: 1, u: 0, v: 0, z: 0, o: 0, b: null, x: 0, y: 0, d: 0, i: 2 } };
    const VS = [{ s: T.serialize(S), lu: t0 / 1000 }];
    const VP = [{ s: T.planSer(P), lu: t0 / 1000 }];
    const plan = (t, neu) => {
      P = { ...P, ...neu };
      VP.push({ s: T.planSer(P), lu: t / 1000 });
    };
    let bit = 30; // weggemachte Häufchen: Bits von oben, die echten von heute zählen von unten
    for (const [vor, { futter = 0, streicheln = 0, mem = 0, paeckchen = 0, putzen = 0 }] of CHR_TAGE) {
      const a = T.chronikStart(heute - vor); // 4 Uhr; gefüttert ab 8, gestreichelt um 12, Päckchen um 13, geputzt um 14 Uhr
      for (let i = 0; i < futter; i++) {
        const t = sek(a + 4 * 36e5 + i * 40 * 6e4);
        plan(t + 2000, { fd: [...P.fd, { t, x: 40, k: 0, e: false }].slice(-3) });
      }
      if (streicheln || mem) plan(sek(a + 8 * 36e5), { cute: { d: heute - vor, n: streicheln, m: mem } });
      for (let i = 0; i < paeckchen; i++) {
        const t = sek(a + 9 * 36e5 + i * 6e5);
        plan(t, { gift: { ...P.gift, z: P.gift.z + 1 } }); // verschenkt
        plan(t + 60000, { gift: { ...P.gift, o: P.gift.o + 1 } }); // ausgepackt
      }
      for (let i = 0; i < putzen; i++) {
        S = { ...S, m: (S.m | (1 << bit--)) >>> 0 };
        VS.push({ s: T.serialize(S), lu: sek(a + 10 * 36e5 + i * 6e4) / 1000 });
      }
    }
    for (const [id, V] of [[sId, VS], [pId, VP]]) {
      V.forEach((r) => chrGen.add(r));
      hist[id] = [...V, ...echt(id)].sort((x, y) => x.lu - y.lu);
    }
    log(`Verlauf: ${CHR_TAGE.map(([vor]) => chrDay(vor)).join(', ')} eingetragen (${VS.length} Stände Zustand, ${VP.length} Stände Tagesplan)`);
  });
  // Ein Mensch schreibt in dieselbe Liste: etwas ganz anderes, einen Eintrag einer späteren Version (ein Feld, das
  // 0.34 nicht kennt), den er abhakt und mit einer Notiz versieht, und einen eigenen Satz zu einem Tag. Den ersten und
  // den letzten fasst die Karte nie an, der mittlere bleibt mit Feld, Haken und Notiz erhalten.
  document.getElementById('chr-human').addEventListener('click', async () => {
    const mensch = (service, data) => hass.callService('todo', service, data, { entity_id: CHR }, false, false, 'Mensch');
    await mensch('add_item', { item: 'Blumen gießen' });
    await mensch('add_item', { item: `Pika-Tag ${chrDay(3)} · futter=2 laune=gut` });
    await mensch('update_item', { item: todo.items.at(-1).uid, status: 'completed', description: 'von Hand abgehakt' });
    await mensch('add_item', { item: `Pika-Tag ${chrDay(4)}: war schön` });
  });
  document.getElementById('chr-check').addEventListener('click', async () => {
    if (!chrOn()) return log('Chronik ist aus: erst „Chronik an/aus“');
    const beide = [...cards];
    beide.forEach((c) => (c._dbgChronik = { check: 2000 }));
    log('Chronik: beide Karten prüfen …');
    const r = await Promise.all(beide.map((c) => c._chronikNow()));
    beide.forEach((c) => delete c._dbgChronik);
    const wort = (v) => (v === true ? 'fertig' : v === false ? 'Fehlschlag (fehlt der Verlauf der Helfer? „Verlauf: vier Tage füllen“)' : 'nicht gelaufen');
    log(`Chronik geprüft: links ${wort(r[0])}, rechts ${wort(r[1])}`);
    chrShow();
  });
  // Liste und Protokoll leeren. Die Karten haben heute schon geprüft und tragen von selbst nichts mehr nach.
  document.getElementById('chr-clear').addEventListener('click', () => {
    todo.items = [];
    todo.calls = [];
    todo.rows = 0;
    if (todoEntity()) push();
    chrShow();
    log('Chronik: Liste geleert');
  });
  // ==================== Ende Chronik ====================
</script>
</body>
</html>
